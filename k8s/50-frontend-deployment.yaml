# DVO-L3-7F2A91
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gyp6-sale
  labels:
    app: frontend
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        mascot: kabachok
      annotations:
        devops-lab/mascot-approved: "true"
        kubectl.kubernetes.io/default-container: frontend
    spec:
      enableServiceLinks: false
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "gyp6.local"
      containers:
        - name: frontend
          image: gyp6-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: gyp6-config
                  key: API_URL
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: gyp6-config
                  key: INTERNAL_BACKEND_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
        - name: proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: proxy-config
          configMap:
            name: frontend-proxy
