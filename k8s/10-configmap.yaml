# DVO-L3-7F2A91
apiVersion: v1
kind: ConfigMap
metadata:
  name: gyp6-config
  namespace: gyp6-sale
  labels:
    app: gyp6
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
data:
  NODE_ENV: "production"
  HTTP_PORT: "4200"
  HTTP_HOST: "http://backend:4200"
  HTTP_CORS: "http://gyp6.local"
  BACKEND_URL: "http://gyp6.local"
  FRONTEND_URL: "http://gyp6.local"
  BETTER_AUTH_URL: "http://gyp6.local"
  API_URL: "http://backend:4200"
  INTERNAL_BACKEND_URL: "http://backend:4200"
  POSTGRES_USER: "gyp6"
  POSTGRES_DB: "gyp6_db"
  REDIS_USER: "default"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RESEND_MAIL_FROM: "onboarding@resend.dev"
  S3_REGION: "us-east-1"
  S3_ENDPOINT: "http://s3:4566"
  S3_BUCKET_NAME: "furniture-wholesale-bucket"
  GOOGLE_CLIENT_ID: ""
  FACEBOOK_CLIENT_ID: ""
  APPLE_CLIENT_ID: ""
