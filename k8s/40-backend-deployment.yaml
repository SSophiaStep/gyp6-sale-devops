# DVO-L3-7F2A91
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gyp6-sale
  labels:
    app: backend
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        mascot: kabachok
      annotations:
        devops-lab/mascot-approved: "true"
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: backend
          image: gyp6-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
          envFrom:
            - configMapRef:
                name: gyp6-config
            - secretRef:
                name: gyp6-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 4200
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4200
            initialDelaySeconds: 30
            periodSeconds: 20
