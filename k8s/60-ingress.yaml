# DVO-L3-7F2A91
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gyp6
  namespace: gyp6-sale
  labels:
    app: gyp6
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: gyp6.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4200
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
