{{- $full := include "gyp6.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-redis
  namespace: {{ .Release.Namespace }}
  {{- include "gyp6.meta" (dict "root" . "component" "redis") | nindent 2 }}
spec:
  type: {{ .Values.redis.service.type }}
  selector:
    {{- include "gyp6.selectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.port }}
