{{- $full := include "gyp6.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-secret
  namespace: {{ .Release.Namespace }}
  {{- include "gyp6.meta" (dict "root" . "component" "secret") | nindent 2 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword is required" .Values.secret.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:%v/%s?schema=public" .Values.postgres.user (required "secret.postgresPassword is required" .Values.secret.postgresPassword | urlquery) $full .Values.postgres.service.port .Values.postgres.database | quote }}
  REDIS_PASSWORD: {{ required "secret.redisPassword is required" .Values.secret.redisPassword | quote }}
  JWT_SECRET: {{ required "secret.jwtSecret is required" .Values.secret.jwtSecret | quote }}
  BETTER_AUTH_SECRET: {{ required "secret.betterAuthSecret is required" .Values.secret.betterAuthSecret | quote }}
  RESEND_API_KEY: {{ required "secret.resendApiKey is required" .Values.secret.resendApiKey | quote }}
  S3_ACCESS_KEY: {{ .Values.secret.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secret.s3SecretKey | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secret.googleClientSecret | quote }}
  FACEBOOK_CLIENT_SECRET: {{ .Values.secret.facebookClientSecret | quote }}
  APPLE_CLIENT_SECRET: {{ .Values.secret.appleClientSecret | quote }}
