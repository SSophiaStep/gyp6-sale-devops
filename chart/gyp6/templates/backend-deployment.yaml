{{- $full := include "gyp6.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-backend
  namespace: {{ .Release.Namespace }}
  {{- include "gyp6.meta" (dict "root" . "component" "backend") | nindent 2 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.backend.strategy.maxUnavailable }}
      maxSurge: {{ .Values.backend.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "gyp6.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gyp6.podLabels" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.utilImage.repository }}:{{ .Values.utilImage.tag }}"
          command: ["sh", "-c", "until nc -z {{ $full }}-postgres {{ .Values.postgres.service.port }}; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ $full }}-config
            - secretRef:
                name: {{ $full }}-secret
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
