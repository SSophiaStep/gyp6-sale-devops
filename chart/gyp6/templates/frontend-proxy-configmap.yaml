{{- if .Values.frontend.proxy.enabled }}
{{- $full := include "gyp6.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-frontend-proxy
  namespace: {{ .Release.Namespace }}
  {{- include "gyp6.meta" (dict "root" . "component" "frontend") | nindent 2 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location {{ .Values.ingress.apiPath }} {
        proxy_pass http://{{ $full }}-backend:{{ .Values.backend.service.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
      }

      location / {
        proxy_pass http://127.0.0.1:{{ .Values.frontend.port }};
        proxy_set_header Host $host;
      }
    }
{{- end }}
