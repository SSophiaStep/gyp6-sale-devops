{{- if .Values.ingress.enabled }}
{{- $full := include "gyp6.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  {{- include "gyp6.meta" (dict "root" . "component" "ingress") | nindent 2 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.publicHost | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.apiPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
